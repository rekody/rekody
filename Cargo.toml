[workspace]
resolver = "2"
members = [
    "crates/rekody-core",
    "crates/rekody-audio",
    "crates/rekody-stt",
    "crates/rekody-llm",
    "crates/rekody-inject",
    "crates/rekody-hotkey",
    "crates/rekody-review",
]
# Vendored crates are patch sources, not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.5.24"
edition = "2024"
license = "MIT"
authors = ["Tony Kipkemboi"]
repository = "https://github.com/rekody/rekody"

[workspace.dependencies]
rekody-core = { path = "crates/rekody-core" }
rekody-audio = { path = "crates/rekody-audio" }
rekody-stt = { path = "crates/rekody-stt" }
rekody-llm = { path = "crates/rekody-llm" }
rekody-inject = { path = "crates/rekody-inject" }
rekody-hotkey = { path = "crates/rekody-hotkey" }
rekody-review = { path = "crates/rekody-review" }

# Shared dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
clap = { version = "4", features = ["derive"] }

# Engine-level dictionary term biasing (issue #91, spec at
# docs/design/nemotron-term-biasing-spec.md, section 5 step 1).
# vendor/parakeet-rs is upstream 0.3.6 byte-identical except for one additive
# hook: a LogitsProcessor trait + setter called from the Nemotron greedy
# decode loop (process before argmax, on_emit after a token commits,
# on_reset on utterance reset). MIT OR Apache-2.0, upstream attribution kept.
# The hook will be offered upstream as a PR; drop this patch entry once a
# parakeet-rs release ships it.
[patch.crates-io]
parakeet-rs = { path = "vendor/parakeet-rs" }
