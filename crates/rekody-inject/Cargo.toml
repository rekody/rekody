[package]
name = "rekody-inject"
publish = false        # internal app crate — never published to crates.io
description = "Cross-platform text injection for rekody"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = "3"
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

# Extra windowing features are only needed by the win_inject_check example
# (a real EDIT control to paste into). Keeping them in dev-dependencies keeps
# the shipped lib's Windows surface minimal — a plain `cargo build -p
# rekody-inject` still compiles with just KeyboardAndMouse.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
