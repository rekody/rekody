[package]
name = "rekody-hotkey"
publish = false        # internal app crate — never published to crates.io
description = "Global hotkey listener for rekody"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# No platform-specific crate deps needed — all macOS APIs used via raw FFI.

# Windows: global low-level keyboard hook (SetWindowsHookEx WH_KEYBOARD_LL).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
