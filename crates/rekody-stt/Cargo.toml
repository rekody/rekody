[package]
name = "rekody-stt"
description = "Speech-to-text engines for rekody (local Whisper + cloud)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
whisper-rs = "0.13"
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Nemotron cache-aware streaming ASR (ONNX via ort). Feature-gated while the
# streaming engine is being built out; CPU EP (CoreML EP is unstable for this
# model per upstream).
parakeet-rs = { version = "0.3.6", optional = true }

[features]
nemotron = ["dep:parakeet-rs"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Apple Silicon: enable Core ML so whisper.cpp can run the encoder pass on
# the Neural Engine (typically ~2× faster than Metal-only). Requires the
# matching .mlmodelc directory to live next to the .bin model file; rekody
# downloads it alongside the GGML model during setup.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.13", features = ["coreml"] }

[dev-dependencies]
tokio = { workspace = true }
hound = "3.5"

[[example]]
name = "nemotron_stream"
required-features = ["nemotron"]
