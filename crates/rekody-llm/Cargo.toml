[package]
name = "rekody-llm"
publish = false        # internal app crate — never published to crates.io
description = "LLM post-processing providers for rekody (Groq, Cerebras, local)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# test-util enables #[tokio::test(start_paused = true)] so the provider
# timeout tests complete instantly instead of sleeping 30 real seconds.
tokio = { version = "1", features = ["test-util"] }
