[package]
name = "rekody-review"
publish = false        # internal app crate — never published to crates.io
description = "Localhost label-review tool for the rekody training dataset"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rekody-stt.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest.workspace = true
clap.workspace = true
dirs = "6"
hound = "3.5"
# manifest_sha256 in export cuts: hashed in-process so the checksum written
# into cut.json is always real (the shasum shell-out used for model
# downloads has a proceed-unverified fallback that would be wrong here).
sha2 = "0.10"
# Tiny sync HTTP server for the localhost review page — no async stack,
# no TLS, exactly what a single-user 127.0.0.1 tool needs.
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
