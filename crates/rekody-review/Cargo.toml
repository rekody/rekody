[package]
name = "rekody-review"
publish = false        # internal app crate — never published to crates.io
description = "Localhost label-review tool for the rekody training dataset"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rekody-stt.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest.workspace = true
clap.workspace = true
dirs = "6"
hound = "3.5"
# manifest_sha256 in export cuts: hashed in-process so the checksum written
# into cut.json is always real (the shasum shell-out used for model
# downloads has a proceed-unverified fallback that would be wrong here).
sha2 = "0.10"
# Tiny sync HTTP server for the localhost review page — no async stack,
# no TLS, exactly what a single-user 127.0.0.1 tool needs.
tiny_http = "0.12"
# Cross-platform advisory file lock serializing the two manifest writers
# (daemon append vs review rewrite) — see dataset_lock.rs / issue #114.
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# Cut archives: the single file a cut travels between machines as. Read and
# write only, deflate through the flate2 already in the tree — no bzip2,
# zstd, lzma, or aes backends pulled in.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Picks zip's compression backend: flate2's pure-Rust one (miniz_oxide),
# already in the tree. Not called from this crate directly — declaring it
# is how the backend gets chosen, and choosing it here keeps a C zlib out.
flate2 = "1"
# Scratch space that cleans itself up: staging a cut before it is zipped,
# and unpacking an incoming zip before it is merged.
tempfile = "3"
