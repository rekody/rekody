name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # Supply-chain gate: scans Cargo.lock for security advisories, disallowed
  # licenses, banned/duplicate crates, and unknown sources (config: deny.toml).
  # Reads the lockfile only — no compilation — so it runs fast on Ubuntu.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Toolchain (pinned version + rustfmt/clippy) comes from rust-toolchain.toml
      # so CI and local dev run the identical clippy ruleset. `rustup show`
      # installs the pinned channel and its components.
      - run: rustup show

      - name: Cache cargo registry and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # ImageVersion in the key: when the runner image (and its Xcode/clang)
          # changes, build a fresh cache instead of restoring a `target/` whose
          # cached C/C++ artifacts (whisper.cpp via cmake) baked in the old
          # Xcode's clang resource-dir path — the cause of the intermittent
          # `ld: search path .../clang/NN/lib/darwin not found` linker failures.
          key: ${{ runner.os }}-${{ env.ImageVersion }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ImageVersion }}-cargo-

      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

      # Verify tarball names in cmd_update (main.rs) and install.sh match release.yml.
      # Catches filename drift before it ships.
      - name: Check release/update/install filename consistency
        run: |
          FAIL=0

          # ── cmd_update (main.rs) ──────────────────────────────────────────────
          UPDATE_PATTERN=$(grep 'let tarball = format!' crates/rekody-core/src/main.rs | \
            sed 's/.*format!("\(.*\)".*/\1/')
          echo "cmd_update pattern : $UPDATE_PATTERN"

          if echo "$UPDATE_PATTERN" | grep -qE 'rekody-v\{'; then
            echo "ERROR: cmd_update has spurious 'v' prefix in tarball name"
            FAIL=1
          fi
          if grep -A2 '"aarch64"' crates/rekody-core/src/main.rs | grep -q '"arm64"'; then
            echo "ERROR: cmd_update maps aarch64 -> arm64 but release.yml uses aarch64"
            FAIL=1
          fi

          # ── install.sh ────────────────────────────────────────────────────────
          INSTALL_TARBALL=$(grep 'TARBALL=' install.sh | grep -v '#' | head -1 | \
            sed 's/.*TARBALL="\(.*\)".*/\1/')
          echo "install.sh pattern : $INSTALL_TARBALL"

          # Must use VERSION_NUM (no v prefix) not VERSION
          if grep 'TARBALL=' install.sh | grep -v '#' | grep -q '"\${VERSION}-'; then
            echo "ERROR: install.sh uses \${VERSION} (includes 'v') in tarball name — use \${VERSION_NUM}"
            FAIL=1
          fi
          if grep -A2 'arm64|aarch64' install.sh | grep -q 'arm64"'; then
            echo "ERROR: install.sh maps aarch64 -> arm64 but release.yml uses aarch64"
            FAIL=1
          fi

          [ $FAIL -eq 0 ] && echo "OK: all filename patterns are consistent"
          exit $FAIL
